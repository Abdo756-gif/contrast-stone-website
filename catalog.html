  var LABELS = {
    thickness: "السُمك",
    tableSize: "مقاس الطاولة",
    color: "اللون",
    inquire: "استفسر عبر واتساب",
    emptyTitle: "الخامات جايه قريباً",
    emptyBody: "لسه بنجهز صور وتفاصيل خامات القسم ده."
  };

  function waLink(name){
    var msg = encodeURIComponent('السلام عليكم، عايز أعرف تفاصيل أكتر عن خامة "' + name + '"');
    return 'https://wa.me/201123883389?text=' + msg;
  }

  var cardCounter = 0;

  function renderCard(item){
    var imgs = item.images && item.images.length ? item.images : (item.image ? [item.image] : []);
    var cardId = 'mc' + (cardCounter++);
    var photo = '';
    if (imgs.length){
      var slides = imgs.map(function(src, i){
        return '<img src="' + src + '" alt="' + item.name + '" loading="lazy" style="' + (i === 0 ? '' : 'display:none;') + '" data-slide="' + i + '">';
      }).join('');
      var nav = imgs.length > 1 ? '' +
        '<button class="mat-photo-nav prev" data-nav="prev" aria-label="السابق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>' +
        '<button class="mat-photo-nav next" data-nav="next" aria-label="التالي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>' +
        '<div class="mat-dots">' + imgs.map(function(_, i){ return '<button class="mat-dot' + (i === 0 ? ' active' : '') + '" data-dot="' + i + '" aria-label="صورة ' + (i+1) + '"></button>'; }).join('') + '</div>'
        : '';
      photo = '<div class="mat-photo" id="' + cardId + '" data-count="' + imgs.length + '">' + slides + nav + '</div>';
    }
    return '' +
      '<div class="mat-card">' +
        photo +
        '<div class="mat-body">' +
          '<div class="mat-name">' + item.name + '</div>' +
          '<div class="mat-meta">' +
            (item.thickness ? '<span><b>' + LABELS.thickness + ':</b> ' + item.thickness + '</span>' : '') +
            (item.color ? '<span><b>' + LABELS.color + ':</b> ' + item.color + '</span>' : '') +
          '</div>' +
          '<a class="mat-cta" href="' + waLink(item.name) + '" target="_blank" rel="noopener">' +
            LABELS.inquire +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20l1.6-4.8A8 8 0 1 1 9 18.6L4 20Z"/><path d="M9 10.5c.4 2 2 3.6 4 4" stroke-linecap="round"/></svg>' +
          '</a>' +
        '</div>' +
      '</div>';
  }

  function renderGroup(key, group){
    var body = group.items.length
      ? '<div class="mat-grid">' + group.items.map(renderCard).join('') + '</div>'
      : '<div class="empty-note"><b>' + LABELS.emptyTitle + '</b>' + LABELS.emptyBody + '</div>';
    return '' +
      '<div class="origin-group" data-origin="' + key + '">' +
        '<div class="origin-heading"><h2>' + group.label + '</h2><span class="count">' + group.items.length + ' خامة</span></div>' +
        body +
      '</div>';
  }

  var root = document.getElementById('catalogRoot');
  root.innerHTML = Object.keys(CATALOG).map(function(key){ return renderGroup(key, CATALOG[key]); }).join('');

  root.addEventListener('click', function(e){
    var navBtn = e.target.closest('[data-nav]');
    var dotBtn = e.target.closest('[data-dot]');
    var imgEl = e.target.closest('img[data-slide]');

    if (!navBtn && !dotBtn && imgEl) {
      var photoEl0 = imgEl.closest('.mat-photo');
      var allImgs = Array.prototype.map.call(photoEl0.querySelectorAll('img[data-slide]'), function(im){ return im.getAttribute('src'); });
      var startIndex = parseInt(imgEl.getAttribute('data-slide'), 10);
      openLightbox(allImgs, startIndex);
      return;
    }

    if (!navBtn && !dotBtn) return;
    var photoEl = e.target.closest('.mat-photo');
    if (!photoEl) return;
    var slides = photoEl.querySelectorAll('img[data-slide]');
    var dots = photoEl.querySelectorAll('.mat-dot');
    var count = slides.length;
    var current = 0;
    slides.forEach(function(s, i){ if (s.style.display !== 'none') current = i; });
    var next = current;
    if (navBtn) {
      var dir = navBtn.getAttribute('data-nav');
      next = dir === 'next' ? (current + 1) % count : (current - 1 + count) % count;
    } else if (dotBtn) {
      next = parseInt(dotBtn.getAttribute('data-dot'), 10);
    }
    slides.forEach(function(s, i){ s.style.display = i === next ? '' : 'none'; });
    dots.forEach(function(d, i){ d.classList.toggle('active', i === next); });
  });

  /* lightbox */
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');
  var lightboxClose = document.getElementById('lightboxClose');
  var lightboxPrev = document.getElementById('lightboxPrev');
  var lightboxNext = document.getElementById('lightboxNext');
  var lbImages = [];
  var lbIndex = 0;

  function showLbImage(){
    lightboxImg.src = lbImages[lbIndex];
    var multi = lbImages.length > 1;
    lightboxPrev.style.display = multi ? '' : 'none';
    lightboxNext.style.display = multi ? '' : 'none';
  }
  function openLightbox(images, startIndex){
    lbImages = images;
    lbIndex = startIndex || 0;
    showLbImage();
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
  }
  function closeLightbox(){
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
    lightboxImg.src = '';
  }
  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', function(e){ if (e.target === lightbox) closeLightbox(); });
  lightboxPrev.addEventListener('click', function(){ lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length; showLbImage(); });
  lightboxNext.addEventListener('click', function(){ lbIndex = (lbIndex + 1) % lbImages.length; showLbImage(); });
  document.addEventListener('keydown', function(e){
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') { lbIndex = (lbIndex + 1) % lbImages.length; showLbImage(); }
    if (e.key === 'ArrowRight') { lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length; showLbImage(); }
  });

  var tabs = document.querySelectorAll('.origin-tab');
  var groups = document.querySelectorAll('.origin-group');
  tabs.forEach(function(tab){
    tab.addEventListener('click', function(){
      tabs.forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      var origin = tab.getAttribute('data-origin');
      groups.forEach(function(g){
        if (origin === 'all' || g.getAttribute('data-origin') === origin) g.classList.remove('hide');
        else g.classList.add('hide');
      });
    });
  });

  var navToggle = document.getElementById('navToggle');
  var mobileMenu = document.getElementById('mobileMenu');
  var mobileMenuClose = document.getElementById('mobileMenuClose');
  if (navToggle && mobileMenu) {
    navToggle.addEventListener('click', function(){ mobileMenu.classList.add('open'); });
    mobileMenuClose.addEventListener('click', function(){ mobileMenu.classList.remove('open'); });
    mobileMenu.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){ mobileMenu.classList.remove('open'); });
    });
  }
</script>
